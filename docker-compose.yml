version: '3.9'

services:

  db:
    image: postgres:15-alpine        # imagen oficial de PostgreSQL
    container_name: reviewhub_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persiste los datos
    ports:
      - "5432:5432"
    healthcheck:                     # espera a que postgres esté listo
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reviewhub_redis
    ports:
      - "6379:6379"

  web:
    build: .                         # construye desde el Dockerfile local
    container_name: reviewhub_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app                       # monta el código local en el contenedor
    ports:
      - "8000:8000"
    env_file:
      - .env                         # carga las variables de entorno
    depends_on:
      db:
        condition: service_healthy   # espera a que db esté lista
      redis:
        condition: service_started

volumes:
  postgres_data:                     # volumen persistente para la DB